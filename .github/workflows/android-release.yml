name: Android Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# Releases are never cancelled halfway: a new push waits for the current one to finish.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Resolve version
        id: version
        run: |
          version="$(.github/scripts/next-version.sh)"
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (since $previous)" >> "$GITHUB_STEP_SUMMARY"

      # react-native-deploy resolves the eas.json profile and dispatches eas-build.yml,
      # which runs prebuild + Gradle and uploads the APK. The command waits for the
      # build and fails if it fails, so no tag is created for a broken build.
      - name: Build APK
        env:
          EAS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DO_NOT_TRACK: '1'
        run: >
          npx --yes @react-native-feel/deploy@0.3.0 build
          --platform android
          --profile preview

      - name: Download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          run_id="$(gh run list --workflow eas-build.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful EAS Build run found for $GITHUB_SHA."
            exit 1
          fi
          gh run download "$run_id" --name application-archive --dir build
          apk="$(find build -name '*.apk' | head -1)"
          mv "$apk" "build/pokedex-v$VERSION.apk"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          .github/scripts/release-notes.sh "$PREVIOUS" HEAD > notes.md
          gh release create "v$VERSION" "build/pokedex-v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md
